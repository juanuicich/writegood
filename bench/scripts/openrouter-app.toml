# OpenRouter as an openai-compatible provider in the app's config.toml.
# The app sends no `provider` routing field, so OpenRouter picks the
# upstream. `run.ts --provider app --block bench/scripts/openrouter-app.toml
# --block-name openrouter` calls it through the app's own client.
[providers.openrouter]
kind         = "openai-compatible"
# The slash at the end is needed. Without it the client joins the path onto
# /api/ and OpenRouter answers 404 (2026-09-23-gaps.md, test 1).
base_url     = "https://openrouter.ai/api/v1/"
model        = "google/gemini-3.8-flash"
key_ref      = "env:OPENROUTER_API_KEY"
thinking     = "low"
timeout_secs = 300
