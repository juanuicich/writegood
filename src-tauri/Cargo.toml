[package]
name = "writegood"
version = "0.1.0"
description = "A writing workshopping tool"
authors = ["Juan"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "writegood_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api"] }
tauri-plugin-http = "~2.6"
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "1"
strsim = "0.11"
similar = "3.2"
keyring = "4"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
