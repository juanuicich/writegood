[package]
name = "writegood"
version = "0.1.0"
description = "A writing workshopping tool"
authors = ["Juan"]
license = "MIT"
edition = "2021"
rust-version = "1.82"
# `src-tauri/examples/probe.rs` is a second target; without this `cargo run`
# cannot tell which one `tauri dev` means.
default-run = "writegood"

[lib]
name = "writegood_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
genai = "0.6"
# Already in the tree through genai; named here to fetch the price catalog.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "1"
strsim = "0.11"
similar = "3.2"
keyring = "4"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "macros"] }
# A WebDriver server inside the app, for tests and for driving a dev build
# (SPEC §16). lib.rs registers it in debug builds only.
tauri-plugin-wdio-webdriver = "1.4"
toml_edit = "0.25.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Proc macros and build scripts run on the host at compile time, and they
# inherit the release profile unless told otherwise. Stripping and optimising
# them breaks the dependency tree: zerofrom, phf and serde all fail to find
# their own derive crates. Build them plainly.
[profile.release.build-override]
opt-level = 0
codegen-units = 16
strip = false
